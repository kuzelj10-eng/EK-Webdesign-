<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EK Design | Premium Web & App Design Agency</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Framer Motion & React Dependencies (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0071e3',
                        surface: {
                            900: '#ffffff',
                            800: '#f5f5f7',
                            700: '#e8e8ed',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 24px -2px rgba(0, 0, 0, 0.04)',
                        'elevated': '0 40px 100px -20px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .apple-button {
            background-color: #1d1d1f;
            color: #ffffff;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }
        
        .apple-button:hover {
            transform: scale(1.02);
            background-color: #323234;
        }

        .apple-link {
            color: #0071e3;
            font-size: 1.25rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .apple-link:hover {
            text-decoration: underline;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // Custom Hook for Translations (Simplified for Single File)
        const translations = {
            EN: {
                hero_title_1: 'CRAFTING',
                hero_title_2: 'DIGITAL PRODUCTS',
                hero_title_3: 'FOR THE ELITE.',
                hero_desc: 'Specialized in premium Web Design and Mobile App development. We transform complex visions into seamless, high-performance digital experiences.',
                hero_cta: 'VIEW WORK',
                cap_title: 'Expertise in Detail.',
                cap_quote: 'Good design is invisible. Great design is felt.',
                proj_label: 'Selected Work',
                cta_title: 'Ready for the next step?',
                cta_desc: 'Let\'s create something exceptional together.'
            },
            DE: {
                hero_title_1: 'GESTALTUNG',
                hero_title_2: 'DIGITALER PRODUKTE',
                hero_title_3: 'FÜR ELITE-BRANDS.',
                hero_desc: 'Spezialisiert auf High-End Webdesign und Mobile App Entwicklung. Wir verwandeln komplexe Visionen in nahtlose, performante digitale Erlebnisse.',
                hero_cta: 'ARBEITEN SEHEN',
                cap_title: 'Expertise im Detail.',
                cap_quote: 'Gutes Design ist unsichtbar. Großartiges Design ist spürbar.',
                proj_label: 'Ausgewählte Projekte',
                cta_title: 'Bereit für den nächsten Schritt?',
                cta_desc: 'Lassen Sie uns gemeinsam Außergewöhnliches schaffen.'
            }
        };

        const PulseImage = ({ src, alt, className }) => (
            <motion.img 
                src={src}
                alt={alt}
                className={className}
                initial={{ scale: 1 }}
                whileInView={{
                    scale: [1, 1.03, 1],
                    transition: { duration: 3, repeat: Infinity, ease: "easeInOut" }
                }}
                whileTap={{ scale: 0.98 }}
            />
        );

        const App = () => {
            const [lang, setLang] = useState('DE');
            const [isScrolled, setIsScrolled] = useState(false);
            const t = translations[lang];

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className={`fixed top-0 left-0 w-full z-[100] transition-all duration-500 ${
                        isScrolled ? 'bg-white/80 backdrop-blur-xl border-b border-black/[0.04] py-4' : 'bg-transparent py-8'
                    }`}>
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                            <span className="text-xl font-bold tracking-tight">EK DESIGN</span>
                            <div className="hidden md:flex items-center gap-10">
                                <a href="#projects" className="text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors">WORK</a>
                                <a href="#capabilities" className="text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors">SERVICES</a>
                                <a href="#contact" className="text-[13px] font-semibold text-slate-500 hover:text-slate-900 transition-colors">CONTACT</a>
                                <div className="flex gap-4 border-l border-slate-200 pl-8">
                                    <button onClick={() => setLang('DE')} className={`text-[11px] font-bold px-3 py-1 rounded-full transition-all ${lang === 'DE' ? 'bg-slate-900 text-white' : 'text-slate-400'}`}>DE</button>
                                    <button onClick={() => setLang('EN')} className={`text-[11px] font-bold px-3 py-1 rounded-full transition-all ${lang === 'EN' ? 'bg-slate-900 text-white' : 'text-slate-400'}`}>EN</button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Hero */}
                    <section className="relative min-h-screen flex flex-col items-center justify-center pt-24 pb-12 text-center bg-white">
                        <motion.div 
                            initial={{ opacity: 0, y: 60 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 1.2, ease: [0.22, 1, 0.36, 1] }}
                            className="max-w-5xl px-6"
                        >
                            <h1 className="text-6xl md:text-8xl lg:text-9xl font-bold leading-[1.02] tracking-[-0.04em] mb-12">
                                <span className="bg-gradient-to-b from-slate-900 to-slate-500 bg-clip-text text-transparent">{t.hero_title_1}</span><br/>
                                <span className="text-slate-400">{t.hero_title_2}</span><br/>
                                {t.hero_title_3}
                            </h1>
                            <p className="text-2xl md:text-3xl text-slate-500 max-w-3xl mb-16 mx-auto font-medium">
                                {t.hero_desc}
                            </p>
                            <div className="flex flex-col sm:flex-row gap-6 justify-center items-center">
                                <button className="apple-button h-14 w-60">{t.hero_cta}</button>
                                <a href="#projects" className="apple-link h-14 px-6">Explore <i data-lucide="arrow-right"></i></a>
                            </div>
                        </motion.div>
                        
                        <motion.div 
                            initial={{ opacity: 0, y: 100, scale: 0.95 }}
                            animate={{ opacity: 1, y: 0, scale: 1 }}
                            transition={{ duration: 1.5, delay: 0.4 }}
                            className="w-full max-w-7xl px-6 mt-24"
                        >
                            <div className="aspect-[21/9] rounded-[48px] overflow-hidden bg-slate-50 shadow-elevated">
                                <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&q=80&w=2000" className="w-full h-full object-cover" />
                            </div>
                        </motion.div>
                    </section>

                    {/* Services */}
                    <section id="capabilities" className="py-48 bg-slate-50">
                        <div className="max-w-6xl mx-auto px-6">
                            <div className="text-center mb-32">
                                <h2 className="text-5xl md:text-7xl font-bold tracking-tight mb-8">{t.cap_title}</h2>
                                <p className="text-2xl text-slate-500 max-w-3xl mx-auto font-medium">{t.cap_quote}</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                                {[1, 2, 3].map((i) => (
                                    <motion.div key={i} whileHover={{ y: -10 }} className="bg-white p-12 rounded-[40px] border border-black/[0.04] shadow-soft">
                                        <div className="w-16 h-16 bg-slate-100 rounded-2xl mb-8"></div>
                                        <h3 className="text-2xl font-bold mb-4">Service {i}</h3>
                                        <p className="text-slate-500 text-lg">Premium solutions tailored for global brands and creative visions.</p>
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Work */}
                    <section id="projects" className="py-48 bg-white">
                        <div className="max-w-6xl mx-auto px-6">
                            <h2 className="text-6xl font-bold mb-32 tracking-tight">{t.proj_label}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-20">
                                <div className="group cursor-pointer">
                                    <div className="aspect-[4/5] rounded-[48px] overflow-hidden bg-slate-50 mb-12 shadow-soft">
                                        <PulseImage src="https://images.unsplash.com/photo-1542744094-24638eff58bb?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="text-4xl font-bold mb-4">Brand Experience</h3>
                                    <p className="text-2xl text-slate-500 font-medium">Digital First Architecture</p>
                                </div>
                                <div className="group cursor-pointer">
                                    <div className="aspect-[4/5] rounded-[48px] overflow-hidden bg-slate-50 mb-12 shadow-soft">
                                        <PulseImage src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=1200" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="text-4xl font-bold mb-4">Global Platform</h3>
                                    <p className="text-2xl text-slate-500 font-medium">E-Commerce refined</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Contact CTA */}
                    <section id="contact" className="py-48 bg-slate-50">
                        <div className="max-w-6xl mx-auto px-6">
                            <div className="bg-white p-20 md:p-32 rounded-[64px] shadow-elevated border border-black/[0.04] text-center">
                                <h2 className="text-5xl md:text-8xl font-bold tracking-tight mb-10">{t.cta_title}</h2>
                                <p className="text-2xl text-slate-500 mb-16 font-medium">{t.cta_desc}</p>
                                <div className="flex flex-col md:flex-row gap-6 max-w-2xl mx-auto">
                                    <input type="email" placeholder="Email" className="flex-1 bg-slate-50 border border-slate-100 px-8 py-6 rounded-3xl text-lg" />
                                    <button className="apple-button h-[72px] px-12 text-lg">Send</button>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-20 bg-white border-t border-black/5 text-center">
                        <div className="max-w-6xl mx-auto px-6">
                            <p className="font-bold text-xl mb-4">EK DESIGN</p>
                            <p className="text-slate-400">© 2024 ALL RIGHTS RESERVED.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize icons
        setTimeout(() => lucide.createIcons(), 100);
    </script>
    
    <!-- Babel for JSX in Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
